<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="" content="">
    <title></title>
    <link rel="stylesheet" href="stylesheet.css" type="text/css">
    <!--From the book: (for setting the page size to the device)-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div class="welcome-text">
    <h1>Welcome to Forest Books!</h1>
</div>
<header id="header">
    <img src="media/logo2.png" alt="Website logo for Forest Books" width="100" height="100">
    <nav id="navigation">
        <button id="nav-home" class="selected">Home</button>
        <button id="nav-posts">Posts</button>
        <button id="nav-contact">Contact</button>
    </nav>
</header>
<main id="content-sections">

    <section id="content-home">
        <h2>Website</h2>
        <article>
            <p>Some information about how this website works</p>
        </article>
    </section>

    <section id="content-posts" class="hide-section">
        <h2>Posts</h2>
        <div id="posts-container"></div>
        <button id="load-more-btn">Load more</button>
    </section>

    <section id="content-contact" class="hide-section">
        <form id="contact-form" novalidate>
            <label for="form-name">Name:</label><br>
            <input type="text"
                   id="form-name"
                   name="Name"
                   title="Your name"
                   pattern="^[^0-9]*$">

            <label for="form-email">E-mail:</label><br>
            <!-- E-mail inputs come with default e-mail validation -->
            <input type="email"
                   required
                   id="form-email"
                   name="E-mail"
                   title="Your e-mail"
                   pattern="^.*[.].*$"> <!--Default e-mail validation doesn't check for period. Let's add a check.-->

            <label for="form-confirm">Confirm to send</label><br>
            <input type="checkbox" id="form-confirm" name="Confirm" value="confirm"
                   title="Checkbox must be checked">

            <input type="submit" value="Submit" id="form-submit" disabled>

            <div id="form-errors"></div>
        </form>
    </section>
</main>
<footer>
    <img src="media/logo2.png" alt="Website logo" width="100" height="100">
    <div id="contactinfo">
        <h5>Contact Us:</h5>
        <p>Email: bookshop@books.com </p>
        <p>Phone: 033 505 535</p>
        <p>Address: 123 Book St Booktown 90292</p>
    </div>
</footer>
<!--Importing this after the body so that the script can find the form elements in the HTML document.-->
<script type="text/javascript" src="formvalidation.js"></script>
<!--Module imports are automatically deferred, but I put it here at the bottom anyway. It adds event listeners, so it must be loaded after the HTML document is loaded.
I use type "module" because script.js imports code/classes from other scripts-->
<script type="module" src="script.js"></script>
</body>
</html>
